<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>英语私教 · 数据管理</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --text: #2b2a28;
    --muted: #8a8072;
    --line: #e7e1d3;
    --accent: #b45309;
    --accent-soft: #fdf3e7;
    --ok: #2e7d32;
    --danger: #c0392b;
    --shadow: 0 1px 3px rgba(90, 75, 40, 0.08);
  }
  body.dark {
    --bg: #1c1c1a;
    --panel: #262624;
    --text: #e8e4da;
    --muted: #9b937f;
    --line: #3a3934;
    --accent: #e8963c;
    --accent-soft: #33291c;
    --ok: #7cb87f;
    --danger: #e07060;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 18px 150px; }

  .head { display: flex; align-items: baseline; gap: 12px; margin: 6px 2px 16px; }
  .head h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .head .sub { color: var(--muted); font-size: 12.5px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .stat .num { font-size: 22px; font-weight: 700; font-family: Georgia, serif; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.warn .num { color: var(--accent); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    appearance: none; background: none; border: none; cursor: pointer;
    padding: 9px 14px; font-size: 14px; color: var(--muted); font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  input, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.08); color: #fff; }
  button.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.btn.danger:hover { filter: brightness(1.08); color: #fff; }
  button.link { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 6px; font-family: inherit; }
  button.link:hover { color: var(--accent); }
  button.link.danger:hover { color: var(--danger); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }

  /* ---- card list (sentences / errors / vocab) ---- */
  .card { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .card:last-child { border-bottom: none; }
  .card:hover { background: color-mix(in srgb, var(--accent-soft) 25%, var(--panel)); }
  .card-main {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16.5px; font-weight: 500; line-height: 1.45;
  }
  .card-zh { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .card-corrected { font-family: Georgia, "Times New Roman", serif; color: var(--ok); font-size: 14.5px; margin-top: 3px; }
  .card-example { font-family: Georgia, "Times New Roman", serif; font-size: 13.5px; opacity: 0.85; margin-top: 4px; line-height: 1.5; }
  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; }
  .card-meta .spacer { flex: 1; }
  .card-details {
    display: none; margin-top: 8px; padding: 8px 12px;
    background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel));
    border-radius: 8px; font-size: 12.5px; color: var(--muted);
  }
  .card.open .card-details { display: block; }
  body.expand-all .card .card-details { display: block; }
  .detail-line { margin: 3px 0; line-height: 1.55; }
  .detail-label {
    display: inline-block; font-size: 11px; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px;
  }
  .detail-line .en-text { white-space: pre-line; }
  body.hide-zh .zh-part { display: none; }

  .muted { color: var(--muted); font-size: 12.5px; }
  .en { font-family: Georgia, "Times New Roman", serif; }
  .audio-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .audio-row { display: flex; align-items: center; gap: 5px; }
  .audio-player { width: 168px; height: 30px; vertical-align: middle; }
  button.audio-btn { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--accent); cursor: pointer; font-size: 14px; }
  button.audio-btn:hover { border-color: var(--accent); }
  .audio-candidate { display: flex; align-items: center; gap: 5px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .audio-candidate .audio-player { width: 145px; }
  .audio-apply { color: var(--ok); }
  .pill { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); }
  .pill.open { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .pill.resolved { color: var(--ok); border-color: var(--ok); }

  .practice-card { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .practice-card:last-child { border-bottom: none; }
  .practice-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .practice-head .date { font-weight: 600; font-family: Georgia, serif; font-size: 15px; }
  .practice-head .spacer { flex: 1; }
  .practice-item { padding: 7px 0; border-top: 1px dashed var(--line); }
  .practice-item:first-of-type { border-top: none; }
  .practice-item .en-text { font-family: Georgia, "Times New Roman", serif; font-size: 16.5px; line-height: 1.5; }
  .practice-item .zh { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---- day-wide playback overlay ---- */
  .all-player-dialog { width: min(720px, 92vw); }
  .all-player-dialog .all-status { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; }
  .all-player-dialog .all-box { padding: 4px 0 2px; }
  .all-player-dialog audio { width: 100%; }
  .all-playlist {
    max-height: 42vh; overflow: auto; margin-top: 12px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .all-playlist-item {
    display: flex; gap: 10px; align-items: baseline;
    padding: 8px 12px; border-bottom: 1px dashed var(--line);
    cursor: pointer; font-size: 13.5px;
  }
  .all-playlist-item:last-child { border-bottom: none; }
  .all-playlist-item:hover { background: color-mix(in srgb, var(--accent-soft) 40%, var(--panel)); }
  .all-playlist-item .idx { color: var(--muted); font-size: 12px; min-width: 16px; }
  .all-playlist-item .stamp { margin-left: auto; }
  .all-playlist-item.active .en-text { color: var(--accent); font-weight: 600; }

  .msg-row { display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .msg-row:last-child { border-bottom: none; }
  .msg-role { min-width: 42px; font-size: 12px; color: var(--muted); padding-top: 2px; }
  .msg-role.user { color: var(--accent); }
  .msg-content { flex: 1; }
  .msg-row > .link { align-self: flex-start; visibility: hidden; }
  .msg-row:hover > .link { visibility: visible; }
  .msg-divider {
    text-align: center; color: var(--muted); font-size: 12px; padding: 5px 0;
    background: color-mix(in srgb, var(--accent-soft) 35%, var(--panel));
    border-bottom: 1px solid var(--line);
  }

  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 12px 14px; }
  .pager .info { color: var(--muted); font-size: 12.5px; }

  .empty { text-align: center; color: var(--muted); padding: 42px 0; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 8px; padding: 9px 18px;
    font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 0.92; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20, 18, 12, 0.45);
    display: none; align-items: center; justify-content: center; z-index: 40;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: min(480px, 92vw); padding: 20px 22px; box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }
  .dialog h3 { margin: 0 0 14px; font-size: 15.5px; }
  .dialog label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .dialog input, .dialog select, .dialog textarea { width: 100%; }
  .dialog textarea { min-height: 60px; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 13px; outline: none; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dialog p { margin: 0; font-size: 13.5px; line-height: 1.6; }

  /* ---- floating tool panel (fixed, bottom-right) ----
     right:16px is only the pre-JS fallback; positionFab() moves the panel to
     hug the content column's right edge so it never drifts to the far window
     edge on wide screens. */
  .fab {
    position: fixed; right: 16px; bottom: 18px; width: 220px; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16); padding: 10px 12px;
  }
  .fab.min { width: auto; padding: 0; border-radius: 999px; }
  .fab.min .fab-body { display: none; }
  .fab.min .fab-toggle {
    position: static; display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; font-size: 20px; border-radius: 999px;
  }
  .fab-toggle {
    position: absolute; top: 6px; right: 8px; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; padding: 0; font-family: inherit; border-radius: 999px;
  }
  .fab-toggle:hover { color: var(--accent); background: var(--accent-soft); }
  .fab-section { margin-top: 9px; }
  .fab-section:first-child { margin-top: 0; }
  .fab-label { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .fab .btn { width: 100%; }
  .fab .fab-row { display: flex; gap: 6px; }
  .fab .fab-row .btn { flex: 1; padding-left: 6px; padding-right: 6px; }
  .fab select { width: 100%; margin-bottom: 6px; }
  .fab .audio-btn { width: 100%; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>英语私教 · 数据管理</h1>
    <span class="sub" id="bindInfo"></span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="sentences">句子收藏</button>
    <button class="tab" data-tab="errors">错误日记</button>
    <button class="tab" data-tab="vocab">单词本</button>
    <button class="tab" data-tab="practice">每日练习</button>
    <button class="tab" data-tab="archive">对话存档</button>
  </div>

  <div class="toolbar" id="toolbar"></div>
  <div class="panel" id="content"><div class="empty">加载中……</div></div>
  <div class="pager" id="pager" style="display:none">
    <span class="info" id="pageInfo"></span>
    <button class="btn" id="prevBtn">上一页</button>
    <button class="btn" id="nextBtn">下一页</button>
  </div>
</div>

<!-- Floating tool panel: stays pinned bottom-right regardless of scrolling.
     Starts collapsed by default; JS restores the remembered state. -->
<div class="fab min" id="fab">
  <button class="fab-toggle" id="fabToggle" title="收起面板">▾</button>
  <div class="fab-body">
    <div class="fab-section">
      <div class="fab-label">显示</div>
      <button class="btn" id="hideZhBtn">纯英文模式：关</button>
      <div style="height:6px"></div>
      <button class="btn" id="expandBtn">展开全部详情</button>
    </div>
    <div class="fab-section" id="fabAudio" style="display:none">
      <div class="fab-label">音频</div>
      <div id="fabAudioControls"></div>
    </div>
    <div class="fab-section">
      <div class="fab-row">
        <button class="btn" id="topBtn">回到顶部</button>
        <button class="btn" id="reloadBtn">刷新列表</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h3 id="dialogTitle">编辑</h3>
    <div id="dialogFields"></div>
    <div class="actions">
      <button class="btn" id="aiFillBtn" style="display:none;margin-right:auto">🤖 AI 填充</button>
      <button class="btn" id="dialogCancel">取消</button>
      <button class="btn primary" id="dialogSave">保存</button>
    </div>
  </div>
</div>

<!-- In-page delete confirmation. The dashboard embeds this page in a sandboxed
     iframe without allow-modals, so window.confirm() is ignored by the browser
     and always returns false — a custom dialog is required. -->
<div class="overlay" id="confirmOverlay">
  <div class="dialog">
    <h3>确认删除</h3>
    <p id="confirmText"></p>
    <div class="actions">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn danger" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<!-- Centered day-wide playback dialog: a wide native player plus the day's
     sentence list; clicking a sentence jumps to its position. -->
<div class="overlay" id="allPlayerOverlay">
  <div class="dialog all-player-dialog">
    <h3 id="allPlayerTitle">全天连播</h3>
    <p class="all-status" id="allPlayerStatus">正在合并当天音频…</p>
    <div class="all-box" id="allPlayerBox" style="display:none">
      <audio id="allPlayerAudio" controls preload="metadata" aria-label="播放当天全部音频"></audio>
    </div>
    <div class="all-playlist" id="allPlaylist"></div>
    <div class="actions">
      <button class="btn" id="allPlayerClose">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const bridge = window.AstrBotPluginPage;

const state = {
  tab: "sentences",
  page: { sentences: 1, errors: 1, vocab: 1, practice: 1, archive: 1 },
  keyword: "",
  date: "",
  errorStatus: "all",
  editing: null,
  audioAvailable: false,
  audioSettings: { emotion_mode: "default", emotion: "", role: "" },
  audioOptions: { roles: [], emotions: [] },
  hideZh: false,
  expandAll: false,
  fabOpen: false,
};
const PAGE_SIZE = 20;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(fn) {
  try { return await fn(); }
  catch (e) { toast(e.message || "请求失败"); throw e; }
}

function applyTheme(isDark) { document.body.classList.toggle("dark", !!isDark); }

async function loadAudioOptions() {
  try {
    const options = await api(() => bridge.apiGet("audio/options"));
    state.audioAvailable = !!options.available;
    state.audioOptions = {
      roles: Array.isArray(options.roles) ? options.roles : [],
      emotions: Array.isArray(options.emotions) ? options.emotions : [],
    };
    state.audioSettings = { ...state.audioSettings, ...(options.settings || {}) };
  } catch (_) {
    state.audioAvailable = false;
  }
}

function syncAudioSettings() {
  const role = document.getElementById("audioRole");
  const mode = document.getElementById("audioEmotionMode");
  const emotion = document.getElementById("audioEmotion");
  if (role) state.audioSettings.role = role.value;
  if (mode) state.audioSettings.emotion_mode = mode.value;
  if (emotion) state.audioSettings.emotion = emotion.value;
  if (emotion) emotion.style.display = state.audioSettings.emotion_mode === "specified" ? "" : "none";
}

function audioSettingsControls() {
  const roles = [...new Set([state.audioSettings.role, ...state.audioOptions.roles].filter(Boolean))];
  const emotions = [...new Set([state.audioSettings.emotion, ...state.audioOptions.emotions].filter(Boolean))];
  return `<select id="audioRole" title="语音角色" aria-label="语音角色">
      <option value="">当前角色</option>${roles.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join("")}
    </select>
    <select id="audioEmotionMode" title="情感模式" aria-label="情感模式">
      <option value="default">沿用插件逻辑</option><option value="auto">自动判断</option><option value="specified">指定情感</option>
    </select>
    <select id="audioEmotion" title="指定情感" aria-label="指定情感">
      <option value="">选择情感</option>${emotions.map((e) => `<option value="${esc(e)}">${esc(e)}</option>`).join("")}
    </select>
    <button class="btn" id="batchAudioBtn" title="补齐当前类型的历史音频">补齐音频</button>`;
}

// Render TTS controls into the floating panel (they used to live in the
// toolbar, which got crowded once filters were present).
function renderFabAudio() {
  const section = document.getElementById("fabAudio");
  if (!state.audioAvailable) { section.style.display = "none"; return; }
  section.style.display = "";
  document.getElementById("fabAudioControls").innerHTML = audioSettingsControls();
  const roleEl = document.getElementById("audioRole");
  const modeEl = document.getElementById("audioEmotionMode");
  const emotionEl = document.getElementById("audioEmotion");
  if (roleEl) roleEl.value = state.audioSettings.role || "";
  if (modeEl) modeEl.value = state.audioSettings.emotion_mode || "default";
  if (emotionEl) emotionEl.value = state.audioSettings.emotion || "";
  if (roleEl) roleEl.onchange = syncAudioSettings;
  if (modeEl) modeEl.onchange = syncAudioSettings;
  if (emotionEl) emotionEl.onchange = syncAudioSettings;
  syncAudioSettings();
  document.getElementById("batchAudioBtn").onclick = batchAudio;
}

function applyDisplayMode() {
  document.body.classList.toggle("hide-zh", state.hideZh);
  document.body.classList.toggle("expand-all", state.expandAll);
  const zhBtn = document.getElementById("hideZhBtn");
  zhBtn.textContent = state.hideZh ? "纯英文模式：开" : "纯英文模式：关";
  zhBtn.classList.toggle("primary", state.hideZh);
  document.getElementById("expandBtn").textContent = state.expandAll ? "收起全部详情" : "展开全部详情";
}

// ==================== stats ====================

async function loadStats() {
  const s = await api(() => bridge.apiGet("stats"));
  const cards = [
    { n: s.sentences, l: "收藏句子" },
    { n: s.errors, l: `错误日记（${s.open_errors} 未解决）` },
    { n: s.vocab, l: "单词本" },
    { n: s.archive, l: "对话存档" },
    { n: s.daily, l: "每日练习" },
    { n: s.due_vocab + s.due_errors, l: "今日到期复习", warn: true },
  ];
  document.getElementById("stats").innerHTML = cards.map((c) =>
    `<div class="stat${c.warn ? " warn" : ""}"><div class="num">${c.n}</div><div class="label">${c.l}</div></div>`
  ).join("");
  const bound = s.bound_umo ? "每日推送：已绑定会话" : "每日推送：未绑定（聊天中发送 /英语绑定）";
  document.getElementById("bindInfo").textContent = bound;
}

// ==================== toolbar ====================

function renderToolbar() {
  const bar = document.getElementById("toolbar");
  const kw = `<input id="kwInput" placeholder="搜索…" value="${esc(state.keyword)}" style="width:200px" />`;
  const dateInput = (state.tab === "sentences" || state.tab === "archive")
    ? `<input type="date" id="dateInput" value="${esc(state.date)}" />` : "";
  const statusSel = state.tab === "errors"
    ? `<select id="statusSel">
        <option value="all">全部状态</option>
        <option value="open">未解决</option>
        <option value="resolved">已掌握</option>
       </select>` : "";
  const addable = ["sentences", "errors", "vocab"].includes(state.tab);
  const addBtn = addable ? `<button class="btn primary" id="addBtn">➕ 新增</button>` : "";
  bar.innerHTML = `${kw}${statusSel}${dateInput}
    <button class="btn" id="refreshBtn">查询</button>
    <button class="btn" id="resetBtn">重置</button>${addBtn}`;
  const statusEl = document.getElementById("statusSel");
  if (statusEl) statusEl.value = state.errorStatus;
  document.getElementById("refreshBtn").onclick = () => {
    state.keyword = document.getElementById("kwInput").value.trim();
    const d = document.getElementById("dateInput");
    if (d) state.date = d.value;
    const s = document.getElementById("statusSel");
    if (s) state.errorStatus = s.value;
    state.page[state.tab] = 1;
    loadTab();
  };
  document.getElementById("resetBtn").onclick = () => {
    state.keyword = ""; state.date = ""; state.errorStatus = "all";
    state.page[state.tab] = 1;
    loadTab();
  };
  const addEl = document.getElementById("addBtn");
  if (addEl) addEl.onclick = () => openCreator(state.tab);
  const kwEl = document.getElementById("kwInput");
  kwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("refreshBtn").click(); });
}

// ==================== audio cells ====================

function audioCell(kind, id, itemIndex, item) {
  const current = item && item.audio;
  const candidate = item && item.audio_candidate;
  const indexAttr = `data-index="${itemIndex}"`;
  let html = '<div class="audio-stack"><div class="audio-row">';
  if (current) {
    html += `<audio class="audio-player" controls preload="metadata" data-audio-id="${current.id}" aria-label="播放音频"></audio>`;
  } else if (state.audioAvailable) {
    html += `<button class="audio-btn" data-act="audio-generate" data-kind="${kind}" data-id="${id}" ${indexAttr} title="生成音频" aria-label="生成音频">▶</button><span class="muted">未生成</span>`;
  } else {
    html += '<span class="muted">语音插件不可用</span>';
  }
  if (state.audioAvailable) {
    html += `<button class="audio-btn" data-act="audio-regenerate" data-kind="${kind}" data-id="${id}" ${indexAttr} title="重新合成候选音频" aria-label="重新合成候选音频">↻</button>`;
  }
  html += '</div>';
  if (candidate) {
    html += `<div class="audio-candidate"><span class="muted">候选</span><audio class="audio-player" controls preload="metadata" data-audio-id="${candidate.id}" aria-label="播放候选音频"></audio><button class="link audio-apply" data-act="audio-apply" data-kind="${kind}" data-id="${id}" ${indexAttr}>应用</button></div>`;
  }
  return html + '</div>';
}

async function hydrateAudioPlayers() {
  const players = [...document.querySelectorAll("audio[data-audio-id]")];
  await Promise.all(players.map(async (player) => {
    const assetId = player.dataset.audioId;
    if (!assetId || !player.isConnected) return;
    try {
      const result = await bridge.apiGet(`audio/ticket/${encodeURIComponent(assetId)}`);
      const url = result?.url || result?.data?.url;
      if (!url || !player.isConnected) throw new Error("audio ticket unavailable");
      player.src = url;
      player.load();
    } catch {
      player.removeAttribute("controls");
      player.title = "音频加载失败，请刷新后重试";
    }
  }));
}

async function audioAction(act, kind, id, itemIndex) {
  syncAudioSettings();
  const payload = { kind, id };
  if (itemIndex >= 0) payload.item_index = itemIndex;
  if (act === "audio-regenerate") Object.assign(payload, state.audioSettings);
  await api(() => bridge.apiPost(`audio/${act.replace("audio-", "")}`, payload));
  toast(act === "audio-apply" ? "候选音频已应用" : "音频已更新");
  await loadTab();
}

async function batchAudio() {
  const button = document.getElementById("batchAudioBtn");
  if (button) button.disabled = true;
  try {
    const kind = state.tab === "sentences" || state.tab === "vocab" || state.tab === "practice" ? state.tab : "all";
    const result = await api(() => bridge.apiPost("audio/batch", { kind, limit: 200 }));
    toast(`音频补齐完成：${result.generated || 0} 条，失败 ${result.failed || 0} 条`);
    await loadTab();
  } finally {
    if (button) button.disabled = false;
  }
}

// ==================== day-wide playback overlay ====================

const allPlayerState = { practiceId: null, items: [] };

// Open the centered day-wide player. The merged per-day audio is cached
// backend-side and shared with the daily push, so this only synthesizes or
// merges once until one of the item audios changes.
async function openAllPlayer(practiceId, title) {
  allPlayerState.practiceId = practiceId;
  allPlayerState.items = [];
  document.getElementById("allPlayerTitle").textContent = `全天连播 · ${title}`;
  document.getElementById("allPlayerStatus").style.display = "";
  document.getElementById("allPlayerBox").style.display = "none";
  document.getElementById("allPlaylist").innerHTML = "";
  document.getElementById("allPlayerOverlay").classList.add("show");
  document.getElementById("allPlayerClose").focus();
  try {
    const result = await api(() => bridge.apiPost("audio/combined", { id: practiceId }));
    const assetId = result && result.id;
    if (!assetId) throw new Error("合并音频失败");
    const ticket = await bridge.apiGet(`audio/ticket/${encodeURIComponent(assetId)}`);
    const url = ticket?.url || ticket?.data?.url;
    if (!url) throw new Error("音频地址获取失败");
    allPlayerState.items = result.items || [];
    const player = document.getElementById("allPlayerAudio");
    player.src = url;
    player.load();
    renderAllPlaylist();
    document.getElementById("allPlayerStatus").style.display = "none";
    document.getElementById("allPlayerBox").style.display = "";
    player.play();
  } catch (_) {
    // api() already toasts the failure reason.
    closeAllPlayer();
  }
}

function closeAllPlayer() {
  const player = document.getElementById("allPlayerAudio");
  player.pause();
  player.removeAttribute("src");
  player.load();
  document.getElementById("allPlayerOverlay").classList.remove("show");
  allPlayerState.practiceId = null;
  allPlayerState.items = [];
}

function renderAllPlaylist() {
  const box = document.getElementById("allPlaylist");
  box.innerHTML = allPlayerState.items.map((it, i) => {
    const total = Math.floor(it.start);
    const stamp = `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    return `<div class="all-playlist-item" data-start="${it.start}">
      <span class="idx">${i + 1}</span>
      <span class="en-text">${esc(it.text)}</span>
      <span class="muted">${stamp}</span>
    </div>`;
  }).join("");
  box.querySelectorAll(".all-playlist-item").forEach((el) => {
    el.onclick = () => {
      const player = document.getElementById("allPlayerAudio");
      player.currentTime = Number(el.dataset.start);
      player.play();
      markActivePlaylistItem();
    };
  });
}

function markActivePlaylistItem() {
  const player = document.getElementById("allPlayerAudio");
  let active = -1;
  for (let i = 0; i < allPlayerState.items.length; i++) {
    if (player.currentTime >= allPlayerState.items[i].start) active = i;
  }
  document.querySelectorAll("#allPlaylist .all-playlist-item").forEach((el, i) => {
    el.classList.toggle("active", i === active);
  });
}

function bindActions() {
  document.querySelectorAll("#content button[data-act]").forEach((btn) => {
    btn.onclick = () => {
      const { act, kind, id } = btn.dataset;
      const itemIndex = Number(btn.dataset.index ?? -1);
      if (act === "delete") removeRow(kind, Number(id));
      else if (act === "edit") openEditor(kind, Number(id));
      else if (act === "details") btn.closest(".card")?.classList.toggle("open");
      else if (act === "allplay") {
        const card = btn.closest(".practice-card");
        openAllPlayer(Number(id), card?.querySelector(".date")?.textContent || "");
      }
      else if (act === "audio-generate" || act === "audio-regenerate" || act === "audio-apply") {
        audioAction(act, kind, Number(id), itemIndex);
      }
    };
  });
}

async function confirmDelete(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("confirmOverlay");
    document.getElementById("confirmText").textContent = message;
    overlay.classList.add("show");
    const done = (val) => {
      overlay.classList.remove("show");
      resolve(val);
    };
    document.getElementById("confirmOk").onclick = () => done(true);
    document.getElementById("confirmCancel").onclick = () => done(false);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
  });
}

async function removeRow(kind, id) {
  const names = { sentences: "句子", errors: "错误", vocab: "单词", practice: "这期练习", archive: "存档消息" };
  if (!(await confirmDelete(`确定删除这条${names[kind] || "记录"}吗？删除后不可恢复。`))) return;
  await api(() => bridge.apiPost(`${kind}/delete`, { id }));
  toast("已删除");
  loadTab();
  loadStats();
}

// ---- archive ----

// Messages flow newest-first; a gap larger than this many minutes between
// neighbours marks a session boundary and gets a visible divider.
const ARCHIVE_GAP_MINUTES = 10;

function archiveGapLabel(minutes) {
  if (minutes >= 1440) return `${Math.floor(minutes / 1440)} 天`;
  if (minutes >= 60) return `${Math.floor(minutes / 60)} 小时`;
  return `${minutes} 分钟`;
}

function renderArchive(data) {
  if (!data.items.length) return `<div class="empty">该日期没有英语对话存档。</div>`;
  let html = "";
  let prev = null; // the newer neighbour already rendered above
  for (const m of data.items) {
    if (prev) {
      const gap = Math.round(
        (new Date(prev.created_at.replace(" ", "T")) - new Date(m.created_at.replace(" ", "T"))) / 60000
      );
      if (gap >= ARCHIVE_GAP_MINUTES) {
        html += `<div class="msg-divider">⏱ 间隔 ${archiveGapLabel(gap)} · 以下为另一段对话</div>`;
      }
    }
    const time = String(m.created_at || "").slice(11, 16);
    html += `<div class="msg-row">
      <div class="msg-role ${m.role === "user" ? "user" : ""}">${m.role === "user" ? "我" : "教练"}</div>
      <div class="msg-content">
        <span class="${m.role === "user" ? "en" : ""}">${esc(m.content)}</span>
        <div class="muted">${time ? `${esc(time)} · ` : ""}${esc(m.date)}</div>
      </div>
      <button class="link danger" data-act="delete" data-kind="archive" data-id="${m.id}">删除</button>
    </div>`;
    prev = m;
  }
  return html;
}

function renderDialogFields(editor, row) {
  document.getElementById("dialogFields").innerHTML = editor.fields.map((f) => {
    const value = esc((row && row[f.key]) ?? "");
    if (f.type === "textarea") return `<label>${f.label}</label><textarea data-key="${f.key}">${value}</textarea>`;
    if (f.type === "select") {
      const current = row ? row[f.key] : f.options[0][0];
      return `<label>${f.label}</label><select data-key="${f.key}">` +
        f.options.map(([v, t]) => `<option value="${v}" ${current === v ? "selected" : ""}>${t}</option>`).join("") +
        "</select>";
    }
    return `<label>${f.label}</label><input data-key="${f.key}" value="${value}" />`;
  }).join("");
}

function openDialog(state0) {
  state.editing = state0;
  document.getElementById("overlay").classList.add("show");
}

async function openEditor(kind, id) {
  const editor = EDITORS[kind];
  if (!editor) return;
  const listData = await api(() => bridge.apiGet(kind, { page: 1, page_size: 200 }));
  const row = listData.items.find((r) => r.id === id);
  if (!row) { toast("记录不存在"); return; }
  document.getElementById("dialogTitle").textContent = editor.title;
  renderDialogFields(editor, row);
  setAiFillVisible(!!editor.aiFillType);
  openDialog({ kind, id, endpoint: editor.endpoint, addMode: false });
}

function openCreator(kind) {
  const editor = EDITORS[kind];
  if (!editor) return;
  document.getElementById("dialogTitle").textContent = `新增${editor.noun}`;
  renderDialogFields(editor, null);
  setAiFillVisible(!!editor.aiFillType);
  openDialog({ kind, id: null, endpoint: `${kind}/add`, addMode: true });
}

function setAiFillVisible(show) {
  document.getElementById("aiFillBtn").style.display = show ? "" : "none";
}

function closeEditor() {
  document.getElementById("overlay").classList.remove("show");
  state.editing = null;
}

async function aiFill() {
  if (!state.editing) return;
  const editor = EDITORS[state.editing.kind];
  const input = document.querySelector(`#dialogFields [data-key="${editor.fillFrom}"]`);
  const text = input ? input.value.trim() : "";
  if (!text) { toast(`请先填写${editor.fillFrom === "word" ? "单词" : "句子"}`); return; }
  const btn = document.getElementById("aiFillBtn");
  btn.disabled = true;
  btn.textContent = "🤖 生成中…";
  try {
    const res = await api(() => bridge.apiPost("ai_fill", { type: editor.aiFillType, text }));
    for (const [k, v] of Object.entries(res.fields || {})) {
      const el = document.querySelector(`#dialogFields [data-key="${k}"]`);
      if (el && v) el.value = v;
    }
    toast("已填充，可修改后保存");
  } finally {
    btn.disabled = false;
    btn.textContent = "🤖 AI 填充";
  }
}

async function saveEditor() {
  if (!state.editing) return;
  const editing = { ...state.editing };
  const payload = {};
  if (!editing.addMode) payload.id = editing.id;
  document.querySelectorAll("#dialogFields [data-key]").forEach((el) => {
    payload[el.dataset.key] = el.value;
  });
  await api(() => bridge.apiPost(editing.endpoint, payload));
  closeEditor();
  toast(editing.addMode ? "已新增" : "已保存");
  if (editing.addMode) state.page[editing.kind] = 1;
  await Promise.all([loadTab(), loadStats()]);
}

const RENDERERS = { sentences: renderSentences, errors: renderErrors, vocab: renderVocab, practice: renderPractice, archive: renderArchive };

async function loadTab() {
  renderToolbar();
  const tab = state.tab;
  const page = state.page[tab];
  const params = { page, page_size: PAGE_SIZE };
  if (state.keyword) params.keyword = state.keyword;
  if (state.date) params.date = state.date;
  if (tab === "errors") params.status = state.errorStatus;

  const content = document.getElementById("content");
  content.innerHTML = `<div class="empty">加载中……</div>`;
  const data = await api(() => bridge.apiGet(tab === "practice" ? "practice" : tab, params));
  const total = data.total ?? data.items?.length ?? 0;
  content.innerHTML = total ? RENDERERS[tab](data) : `<div class="empty">暂无数据</div>`;
  bindActions();
  await hydrateAudioPlayers();

  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const pager = document.getElementById("pager");
  pager.style.display = total > 0 ? "flex" : "none";
  document.getElementById("pageInfo").textContent = `共 ${total} 条 · 第 ${page} / ${totalPages} 页`;
  document.getElementById("prevBtn").disabled = page <= 1;
  document.getElementById("nextBtn").disabled = page >= totalPages;
}

document.getElementById("prevBtn").onclick = () => { state.page[state.tab] = Math.max(1, state.page[state.tab] - 1); loadTab(); };
document.getElementById("nextBtn").onclick = () => { state.page[state.tab] += 1; loadTab(); };

document.querySelectorAll("#tabs .tab").forEach((el) => {

    state.keyword = ""; state.date = ""; state.errorStatus = "all";
    loadTab();
  };
});

// Floating panel: collapse toggle + display mode + quick actions.
const fabEl = document.getElementById("fab");
const fabToggle = document.getElementById("fabToggle");

// Keep the panel hugging the content column's right edge instead of the far
// window edge; on narrow windows there is no room beside the column, so clamp
// back to the viewport edge.
function positionFab() {
  const wrapRect = document.querySelector(".wrap").getBoundingClientRect();
  const left = Math.min(
    wrapRect.right + 12,
    window.innerWidth - fabEl.offsetWidth - 12
  );
  fabEl.style.left = `${Math.max(12, left)}px`;
  fabEl.style.right = "auto";
}
window.addEventListener("resize", positionFab);

fabToggle.onclick = () => {
  state.fabOpen = !state.fabOpen;
  try { localStorage.setItem("en_tutor_fab_open", state.fabOpen ? "1" : "0"); } catch { /* ignore */ }
  fabEl.classList.toggle("min", !state.fabOpen);
  fabToggle.textContent = state.fabOpen ? "▾" : "⚙";
  fabToggle.title = state.fabOpen ? "收起面板" : "展开面板";
  positionFab();
};
document.getElementById("hideZhBtn").onclick = () => {
  state.hideZh = !state.hideZh;
  // localStorage is blocked in the sandboxed iframe (no allow-same-origin);
  // degrade to in-memory only when it throws.
  try { localStorage.setItem("en_tutor_hide_zh", state.hideZh ? "1" : "0"); } catch { /* ignore */ }
  applyDisplayMode();
};
document.getElementById("expandBtn").onclick = () => {
  state.expandAll = !state.expandAll;
  applyDisplayMode();
};
document.getElementById("topBtn").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
document.getElementById("reloadBtn").onclick = () => loadTab();

// Collapsed by default; remember the user's choice when storage is available.
try {
  if (localStorage.getItem("en_tutor_fab_open") === "1") state.fabOpen = true;
} catch { /* ignore */ }
fabEl.classList.toggle("min", !state.fabOpen);
fabToggle.textContent = state.fabOpen ? "▾" : "⚙";
fabToggle.title = state.fabOpen ? "收起面板" : "展开面板";
try { state.hideZh = localStorage.getItem("en_tutor_hide_zh") === "1"; } catch { /* ignore */ }
positionFab();

const context = await bridge.ready();
applyTheme(context.isDark);
bridge.onContext((c) => applyTheme(c.isDark));
await loadAudioOptions();
renderFabAudio();
await loadStats();
applyDisplayMode();
await loadTab();
</script>
</body>
</html>
